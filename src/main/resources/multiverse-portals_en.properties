# Config command
mv-portals.config.description=Allows you to set Global MV Portals Variables.
mv-portals.config.property.description=The property to set or get info of.
mv-portals.config.value.description=The value to set.

# Create command
mv-portals.create.description=Creates a new portal, assuming you have a region selected.
mv-portals.create.name.description=Name of the portal to create.
mv-portals.create.destination.description=Optional destination for the portal.
mv-portals.create.invalidname=&cInvalid portal name. It must not contain dot or special characters.
mv-portals.create.success=New portal (&3{name}&f) created and selected!
mv-portals.create.alreadyexists=New portal (&3{name}&f) was NOT created!\nIt already existed and has been selected.
mv-portals.create.actionnotset=&cPortal action not set. Use &3/mvp modify action <value>&c to set one.

# Debug command
mv-portals.debug.description=Instead of teleporting you to a place when you walk into a portal you will see the details about it. This command toggles.
mv-portals.debug.toggle.description=Enables, disables, or toggles portal debug mode.
mv-portals.debug.enabled=Portal debug mode &aENABLED\n&fUse &3/mvp debug&f to disable.
mv-portals.debug.disabled=Portal debug mode &cDISABLED

# Info command
mv-portals.info.description=Displays information about a portal.
mv-portals.info.portal.description=The portal to show info

# List command
mv-portals.list.description=Displays a listing of all portals that you can enter.
mv-portals.list.filter.description=Filter by name or world
mv-portals.list.page.description=Page to display
mv-portals.list.header=&b--- &b{count} Portals{world}{filter} &6- Page {page}/{totalPages}&b ---
mv-portals.list.header.world=\ in &e{world}
mv-portals.list.header.filter=\ &6[{filter}]
mv-portals.list.entry=&e{name} &b-> &6{destination}

# Modify command
mv-portals.modify.description=Allows you to modify all values that can be set.
mv-portals.modify.portal.description=The portal to modify.
mv-portals.modify.property.description=The property to modify.
mv-portals.modify.value.description=The value to set.
mv-portals.modify.heredeprecated=Using 'here' as a destination is deprecated and will be removed in a future version. Use 'e:@here' instead.
mv-portals.modify.savefailed=Could not save portals configuration file!
mv-portals.modify.success=&aProperty &b{name}&a of Portal &e{portal}&a was set to &b{value}
mv-portals.modify.actiontypewarning=Please note that changing the action type &edoes NOT modify &cthe action itself. You need to modify the action property as well to ensure the portal works as expected.
mv-portals.modify.failure=Property &b{name}&c of Portal &e{portal}&c was NOT set to &b{value}

# Remove command
mv-portals.remove.description=Removes a existing portal.
mv-portals.remove.name.description=The name of the portal to remove.
mv-portals.remove.notfound=The portal Portal &3{name}&f does NOT exist!
mv-portals.remove.success=Portal &3{name}&f was removed successfully!

# Select command
mv-portals.select.description=Selects a portal so you can perform multiple modifications on it.
mv-portals.select.portal.description=The portal to select
mv-portals.select.none=You have not selected a portal yet!\nUse a &a{wandMaterial}&f to do so!
mv-portals.select.current=You have selected: &3{name}
mv-portals.select.success=Portal: &3{name}&f has been selected.

# Wand command
mv-portals.wand.description=Gives you the wand that MV uses. This will only work if you are NOT using WorldEdit.
mv-portals.wand.action.description=Enable, disable, or toggle the wand.
mv-portals.wand.invalidaction=&cYou must specify one of 'enable,' 'disable,' or 'toggle!'
mv-portals.wand.worldedit=&aCool!&f You're using&b WorldEdit! \n&fJust use &6the WorldEdit wand &fto perform portal selections!
mv-portals.wand.given=You have been given a &aMultiverse Portal Wand({wandMaterial})!
mv-portals.wand.inventory=A &aMultiverse Portal Wand({wandMaterial})&f has been placed in your inventory.
mv-portals.wand.dropped=Your Inventory is full. A &aMultiverse Portal Wand({wandMaterial})&f has been placed dropped nearby.

# Command contexts
mv-portals.context.portal.playerselectionrequired=This command can only be used by a player that has selected a portal with `/mvp select`.
mv-portals.context.portal.notfound=The portal '{name}' doesn't exist or you're not allowed to use it!

# Portal selection
mv-portals.selection.first=&bFirst position set to: {position}
mv-portals.selection.first.area=&bFirst position set to: {position}&6 ({count} blocks)
mv-portals.selection.second=&bSecond position set to: {position}
mv-portals.selection.second.area=&bSecond position set to: {position}&6 ({count} blocks)
mv-portals.selection.worldedit.incomplete=You haven't finished your selection.
mv-portals.selection.worldedit.required=You must have a WorldEdit selection to do this.
mv-portals.selection.left.required=You need to LEFT click on a block with your wand!
mv-portals.selection.right.required=You need to RIGHT click on a block with your wand!
mv-portals.selection.sameworld.required=You need to select both coords in the same world!\nLeft Click Position was in:{leftWorld}\nRight Click Position was in:{rightWorld}

# Portal information
mv-portals.portalinfo.header=&b--- Portal Info &3{name}&b ---
mv-portals.portalinfo.commandheader=&b--- Portal Info: &3{name}&b ---
mv-portals.portalinfo.debugheader=&b--- You are currently standing in &3{name}&b ---
mv-portals.portalinfo.customheader=&b--- {header}&3{name}&b ---
mv-portals.portalinfo.coordinates=&fCoords: &6{fromLocation}&f to &6{toLocation}&f in &6{world}
mv-portals.portalinfo.world.error=&c!!ERROR!!
mv-portals.portalinfo.actiontype=&fConfigured Action Type: &6{actionType}
mv-portals.portalinfo.action=&fConfigured Action: &6{action}
mv-portals.portalinfo.action.notset=&fConfigured Action: &c&oNOT SET!
mv-portals.portalinfo.checkdestinationsafety=&fCheck Destination Safety: {value}
mv-portals.portalinfo.teleportnonplayers=&fTeleport Non Players: {value}
mv-portals.portalinfo.price=Price: &a{value}
mv-portals.portalinfo.price.free=Price: &aFREE!
mv-portals.portalinfo.playeraction=\n&fYour action when using Portal: {action}
mv-portals.portalinfo.actionerror=\n{error}

# Portal destinations
mv-portals.destination.world=(World) &3{destination}
mv-portals.destination.location=(Location) &3{world}, {location}
mv-portals.destination.raw=&3{destination}
mv-portals.destination.invalidlocation=&cInvalid Exact World Location!
mv-portals.destination.invalid=&cInvalid Destination!
mv-portals.destination.portal.invalidformat=Invalid format! Expected format is: p:portalName:[direction]
mv-portals.destination.portal.notfound=Portal '{name}' does not exist!

# Portal actions
mv-portals.action.unknown.type=Unknown action type '{name}'. Supported types are: {types}
mv-portals.action.command.invalid=Please specific a valid command to run as the portal's action.
mv-portals.action.command.self=&bRuns command myself &6/{command}
mv-portals.action.command.operator=&bRuns command as operator &6/{command}
mv-portals.action.command.console=&bRuns command from console &6/{command}
mv-portals.action.multiversedestination.invalid=Please specific a multiverse destination as the portal's action.
mv-portals.action.multiversedestination.description=&bTeleports to &6{destination}
mv-portals.action.server.invalid=Please specific a server name as the portal's action.
mv-portals.action.server.playersonly=Only players can teleport between servers!
mv-portals.action.server.proxyerror=An error occurred while sending plugin message to proxy: {error}
mv-portals.action.server.proxyunknownerror=An unknown error occurred while sending plugin message to proxy.
mv-portals.action.server.description=&bTransfer to &6{name}&b server

# Portal use
mv-portals.portal.action.success=&aYou have successfully used &f{portal} portal&a!
mv-portals.portal.permission.denied=&cYou do not have permission to use this portal.
mv-portals.portal.frame.invalid=This portal's frame is made of an &cincorrect material. You should exit it now.
mv-portals.portal.destination.invalid=This Multiverse Portal does not have a valid destination!
mv-portals.portal.insufficientfunds=You need {price} to enter the {name} portal.
mv-portals.portal.cooldown=There is a portal &bcooldown &fin effect. Please try again in &6{cooldown}&f.
mv-portals.portal.fill.invalidsize=Cannot fill portal, It needs a width or depth of &61&f. w:[&b{width}&f] d:[&b{depth}&f]

# Portal configuration
mv-portals.portalconfig.location.playersonly=You can only use '@selected-region' as a player.
mv-portals.portalconfig.location.selectionrequired=You must select a region first. See `/mvp wand` for more info.
mv-portals.portalconfig.location.invalid=Invalid location format. The portal location must be in the format `WORLD:X,Y,Z:X,Y,Z`.

# Generic
mv-portals.generic.true=&atrue
mv-portals.generic.false=&cfalse
mv-portals.generic.error.details={error}
