name: 'PR: Artifact Comment'

on:
  workflow_run:
    workflows: ['PR: Test']
    types: [completed]

jobs:
  comment-artifact:
    permissions:
      actions: read
      pull-requests: write
    uses: Multiverse/Multiverse-Core/.github/workflows/generic.artifact_comment.yml@main
    with:
      plugin_name: multiverse-portals
